name: Yanii Windows local test package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile replacement server and prepare package
        shell: pwsh
        run: ./yanii/build-windows.ps1
      - name: Test login, character, movement and persistence with PowerShell 5
        shell: powershell
        run: |
          $workspace = (Get-Location).Path
          $target = Join-Path $workspace ('T' + [char]0x00E0 + 'i li' + [char]0x1EC7 + 'u')
          Move-Item build/NgocRongLive-Yanii-PC $target
          try { & (Join-Path $target 'launch.ps1') -SmokeTest }
          finally { Set-Location -LiteralPath $workspace; Move-Item -LiteralPath $target -Destination build/NgocRongLive-Yanii-PC }
      - name: Initialize supplied Unity player in batch mode
        shell: pwsh
        run: |
          $client = Resolve-Path build/NgocRongLive-Yanii-PC/client/NroYanii.exe
          $log = Join-Path (Get-Location) 'build/NgocRongLive-Yanii-PC/logs/client-init.log'
          $process = Start-Process $client -WorkingDirectory (Split-Path $client) -ArgumentList @('-batchmode','-nographics','-quit','-logFile',('"' + $log + '"')) -PassThru
          $exited = $process.WaitForExit(60000)
          if (Test-Path $log) { Get-Content $log -Tail 80 }
          if (!$exited) { Write-Host ('Window: ' + $process.MainWindowTitle); $process.Kill(); throw 'Client initialization timeout' }
          if (!(Test-Path $log)) { throw 'Unity did not create its initialization log' }
          if ($process.ExitCode) { throw "Client initialization failed: $($process.ExitCode)" }
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yanii-windows-diagnostics
          path: build/NgocRongLive-Yanii-PC/logs/
      - name: Remove CI saves and credentials
        shell: pwsh
        run: |
          Remove-Item build/NgocRongLive-Yanii-PC/local-data -Recurse -Force
          Remove-Item build/NgocRongLive-Yanii-PC/logs -Recurse -Force
          Copy-Item upstream-yanii/Server/resources/config/server.properties build/NgocRongLive-Yanii-PC/server/resources/config/server.properties -Force
          Copy-Item upstream-yanii/Login/server.ini build/NgocRongLive-Yanii-PC/login/server.ini -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NgocRongLive-Yanii-PC-test
          path: build/NgocRongLive-Yanii-PC/
          retention-days: 14
