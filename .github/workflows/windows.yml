name: Windows local test package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile server and prepare Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test shipped launcher with PowerShell 5 and Unicode path
        shell: powershell
        run: |
          $unicode = 'T' + [char]0x00E0 + 'i li' + [char]0x1EC7 + 'u'
          $target = Join-Path (Get-Location) $unicode
          Move-Item build/NgocRongLive-PC $target
          try { & (Join-Path $target 'launch.ps1') -SmokeTest }
          finally { Move-Item -LiteralPath $target -Destination build/NgocRongLive-PC }
      - name: Verify no external Java installation is needed
        shell: powershell
        run: |
          $env:JAVA_HOME = 'C:\nonexistent-java'
          $env:JRE_HOME = 'C:\nonexistent-java'
          & ./build/NgocRongLive-PC/runtime/java/bin/java.exe -version
          if ($LASTEXITCODE) { throw 'Bundled Java failed' }
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: build/NgocRongLive-PC/logs/
      - name: Remove only CI-generated local credentials and database
        shell: pwsh
        run: |
          Remove-Item build/NgocRongLive-PC/data -Recurse -Force
          Remove-Item build/NgocRongLive-PC/logs -Recurse -Force
      - name: Upload local test package
        uses: actions/upload-artifact@v4
        with:
          name: NgocRongLive-PC-local-test
          path: build/NgocRongLive-PC/
          retention-days: 14
