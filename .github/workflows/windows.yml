name: Windows local test package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile server and prepare Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test isolated database and server
        shell: pwsh
        run: ./build/NgocRongLive-PC/launch.ps1 -SmokeTest
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: build/NgocRongLive-PC/logs/
      - name: Remove only CI-generated local credentials and database
        shell: pwsh
        run: |
          Remove-Item build/NgocRongLive-PC/data -Recurse -Force
          Remove-Item build/NgocRongLive-PC/logs -Recurse -Force
      - name: Upload local test package
        uses: actions/upload-artifact@v4
        with:
          name: NgocRongLive-PC-local-test
          path: build/NgocRongLive-PC/
          retention-days: 14
