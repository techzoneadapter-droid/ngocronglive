name: Yanii Windows local test package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test driver
        run: python -m pip install playwright==1.51.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile replacement server and prepare package
        id: build
        shell: pwsh
        run: ./yanii/build-windows.ps1
      - name: Test login, character, movement and persistence with PowerShell 5
        env:
          NRO_UI_TEST: '1'
        shell: powershell
        run: |
          $workspace = (Get-Location).Path
          $target = Join-Path $workspace ('T' + [char]0x00E0 + 'i li' + [char]0x1EC7 + 'u')
          Move-Item build/NgocRongLive-Yanii-PC $target
          try { & (Join-Path $target 'launch.ps1') -SmokeTest -ClientPreview }
          finally { Set-Location -LiteralPath $workspace; Move-Item -LiteralPath $target -Destination build/NgocRongLive-Yanii-PC }
      - name: Verify standalone server restart and graceful owner shutdown
        shell: powershell
        run: ./yanii/test-standalone.ps1 -Package build/NgocRongLive-Yanii-PC
      - name: Initialize supplied Unity player in batch mode
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $client = Resolve-Path build/NgocRongLive-Yanii-PC/client/NroYanii.exe
          $log = Join-Path (Get-Location) 'build/NgocRongLive-Yanii-PC/logs/client-init.log'
          $process = Start-Process $client -WorkingDirectory (Split-Path $client) -ArgumentList @('-batchmode','-nographics','-quit','-logFile',('"' + $log + '"')) -PassThru
          # This supplied player does not honor -quit in the hosted headless session.
          # Probe engine + first scene initialization, then stop the test process deliberately.
          $exited = $process.WaitForExit(20000)
          if (!(Test-Path $log)) { if (!$exited) { $process.Kill() }; throw 'Unity initialization log missing' }
          $content = Get-Content $log -Raw
          Write-Host $content
          if (!$exited) { $process.Kill(); $process.WaitForExit() }
          elseif ($process.ExitCode) { throw "Client initialization failed: $($process.ExitCode)" }
          if ($content -notmatch 'Initialize engine version: 2022' -or $content -notmatch 'UnloadTime:') { throw 'Unity did not reach scene initialization' }
          if ($content -match 'Failed to initialize|Data folder not found|Failed to load') { throw 'Unity initialization reported a failure' }
          Write-Host 'PASS: bounded Unity engine/scene initialization probe. Rendering, input and gameplay are not verified.'
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yanii-windows-diagnostics
          path: build/NgocRongLive-Yanii-PC/logs/
      - name: Remove CI saves and credentials
        shell: pwsh
        run: |
          Remove-Item build/NgocRongLive-Yanii-PC/local-data -Recurse -Force
          Remove-Item build/NgocRongLive-Yanii-PC/logs -Recurse -Force
          Remove-Item build/NgocRongLive-Yanii-PC/backups -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/NgocRongLive-Yanii-PC/QUAN-TRI.txt,build/NgocRongLive-Yanii-PC/TAI-KHOAN.txt -Force -ErrorAction SilentlyContinue
          Copy-Item upstream-yanii/Server/resources/config/server.properties build/NgocRongLive-Yanii-PC/server/resources/config/server.properties -Force
          Copy-Item upstream-yanii/Login/server.ini build/NgocRongLive-Yanii-PC/login/server.ini -Force
      - name: Prepare small repair for existing Yanii package
        shell: pwsh
        run: |
          $source = 'build/NgocRongLive-Yanii-PC'
          $patch = 'build/NgocRongLive-Admin-update'
          New-Item "$patch/server","$patch/client/NroYanii_Data/il2cpp_data/Metadata" -ItemType Directory -Force | Out-Null
          Copy-Item "$source/launch.ps1" "$patch/launch.ps1"
          foreach ($name in @('SERVER.cmd','CLIENT.cmd','ADMIN.cmd','STOP.cmd','BACKUP.cmd','backup.ps1','ADMIN-GUIDE.md')) { Copy-Item (Join-Path $source $name) (Join-Path $patch $name) }
          Copy-Item "$source/server/app.jar" "$patch/server/app.jar"
          Copy-Item "$source/client/GameAssembly.dll" "$patch/client/GameAssembly.dll"
          Copy-Item "$source/client/NroYanii_Data/level0" "$patch/client/NroYanii_Data/level0"
          Copy-Item "$source/client/NroYanii_Data/il2cpp_data/Metadata/global-metadata.dat" "$patch/client/NroYanii_Data/il2cpp_data/Metadata/global-metadata.dat"
          'Close game and PLAY.cmd. Extract this update into the existing Yanii folder next to PLAY.cmd, replacing matching files. Keep local-data unchanged. Start SERVER.cmd, read QUAN-TRI.txt, open ADMIN.cmd. Use CLIENT.cmd to play and STOP.cmd to save and stop.' | Set-Content "$patch/INSTALL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: NgocRongLive-Admin-update
          path: build/NgocRongLive-Admin-update/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: NgocRongLive-Yanii-PC-test
          path: build/NgocRongLive-Yanii-PC/
          retention-days: 14
