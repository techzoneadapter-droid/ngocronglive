name: Yanii client startup repair
on:
  push:
    paths:
      - '.github/workflows/client-repair.yml'
      - 'yanii/client-preview.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch supplied client at pinned revision
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/yanii7905/Nro_Yanii.git upstream-client
          git -C upstream-client sparse-checkout set AppLocal
          git -C upstream-client checkout a443509f203eb21b7f39bb5a5234df4b1ddcfbea
          if ($LASTEXITCODE) { throw 'Client checkout failed' }
          Rename-Item upstream-client/AppLocal/Data NroYanii_Data
          $data='upstream-client/AppLocal/NroYanii_Data'
          if ((Get-FileHash "$data/level0").Hash -ne 'A4C3EC4739F9A151B763D87CC936F346895146CE2A31B8687ED783E1F7F8D79C') { throw 'Unexpected bootstrap scene' }
          Copy-Item "$data/level0" "$data/level0.webip-original"
          Copy-Item "$data/level1" "$data/level0" -Force
      - name: Open actual client window and capture it
        shell: pwsh
        run: ./yanii/client-preview.ps1 -ClientDirectory upstream-client/AppLocal -OutputDirectory preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yanii-client-startup-preview
          path: preview/
      - name: Prepare small repair
        shell: pwsh
        run: |
          New-Item repair/client/NroYanii_Data -ItemType Directory -Force | Out-Null
          Copy-Item upstream-client/AppLocal/NroYanii_Data/level0 repair/client/NroYanii_Data/
          Copy-Item upstream-client/AppLocal/NroYanii_Data/level0.webip-original repair/client/NroYanii_Data/
          Copy-Item yanii/launch.ps1 repair/launch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NgocRongLive-Yanii-fix-black-screen
          path: repair/
          retention-days: 14
